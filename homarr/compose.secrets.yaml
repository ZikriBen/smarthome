# smarthome-secrets override for homarr (READY, native *_FILE).
# Image ghcr.io/homarr-labs/homarr:latest (pull_policy: always): ENTRYPOINT
# /app/entrypoint.sh, CMD ["sh","run.sh"], root, then su-exec $PUID (default 0).
# entrypoint.sh exports X from X_FILE for every *_FILE var (strips \n\r) and logs the
# NAME only. No shim needed; entrypoint/cmd unchanged.
services:
  homarr:
    environment:
      SECRET_ENCRYPTION_KEY: !reset null
      SECRET_ENCRYPTION_KEY_FILE: /run/secrets/SECRET_ENCRYPTION_KEY
    secrets:
      - source: homarr_SECRET_ENCRYPTION_KEY
        target: SECRET_ENCRYPTION_KEY

secrets:
  homarr_SECRET_ENCRYPTION_KEY:
    file: /run/smarthome-secrets/homarr/SECRET_ENCRYPTION_KEY
