services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8091:8091"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
