services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    # :8091 basic-auth (see conf/Caddyfile). caddy/.env is git-ignored; keep the bcrypt hash
    # single-quoted there. env_file passes values literally (no $ interpolation).
    env_file:
      - .env

    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8091:8091"

    environment:
      # :8091 basic-auth (see conf/Caddyfile). Put them in caddy/.env; single-quote the bcrypt hash there.
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?set CADDY_BASIC_AUTH_USER in caddy/.env}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?set CADDY_BASIC_AUTH_HASH in caddy/.env}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
