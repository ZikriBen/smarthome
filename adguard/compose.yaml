services:
  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      - "10.0.0.13:53:53/tcp"
      - "10.0.0.13:53:53/udp"
      - "10.0.0.13:3000:3000/tcp"
      - "10.0.0.13:8080:80/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
