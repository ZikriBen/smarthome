services:
  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      - "${LAN_IP:?set LAN_IP in adguard/.env}:53:53/tcp"
      - "${LAN_IP:?set LAN_IP in adguard/.env}:53:53/udp"
      - "${LAN_IP:?set LAN_IP in adguard/.env}:3000:3000/tcp"
      - "${LAN_IP:?set LAN_IP in adguard/.env}:8080:80/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
