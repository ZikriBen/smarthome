# smarthome-secrets override for beszel-agent (READY, native *_FILE).
# Image henrygd/beszel-agent:latest: ENTRYPOINT /agent, scratch image (NO shell, so the
# shim cannot be used), no USER (root). The agent reads TOKEN_FILE natively
# ("must set TOKEN or TOKEN_FILE"; KEY/KEY_FILE likewise). BESZEL_KEY is the hub's PUBLIC
# key and stays in .env. Check first: `docker image inspect henrygd/beszel-agent:latest
# --format '{{.Created}}'` (verified on the 2026-10-02 build).
services:
  beszel-agent:
    environment:
      TOKEN: !reset null
      TOKEN_FILE: /run/secrets/BESZEL_TOKEN
    secrets:
      - source: beszel_BESZEL_TOKEN
        target: BESZEL_TOKEN

secrets:
  beszel_BESZEL_TOKEN:
    file: /run/smarthome-secrets/beszel-agent/BESZEL_TOKEN
