# smarthome-secrets override for mail-rss-service (READY, shim).
# Image: built from mail_rss_service/Dockerfile (python:3.11-slim, dash /bin/sh), no
# ENTRYPOINT, CMD below, no USER (root). Settings come from env (pydantic-settings); the
# keys removed from .env (env_file) are exported by the shim instead.
services:
  mail-rss-service:
    entrypoint: ["/usr/local/bin/secrets-env-shim"]
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      IMAP_USER_FILE: /run/secrets/IMAP_USER
      IMAP_PASS_FILE: /run/secrets/IMAP_PASS
      SECRETS_FROM_FILES: IMAP_USER IMAP_PASS
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: mailrss_IMAP_USER
        target: IMAP_USER
      - source: mailrss_IMAP_PASS
        target: IMAP_PASS

secrets:
  mailrss_IMAP_USER:
    file: /run/smarthome-secrets/mail-rss-service/IMAP_USER
  mailrss_IMAP_PASS:
    file: /run/smarthome-secrets/mail-rss-service/IMAP_PASS
