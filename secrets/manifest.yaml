# smarthome-secrets manifest — NAMES ONLY, never values.
# Installed to /etc/smarthome-secrets/manifest.yaml (root-owned) by install-host.sh.
#
# Each entry is a migration unit = a credential namespace <svc>:
#   /etc/credstore.encrypted/smarthome/<svc>.<NAME>  ->  /run/smarthome-secrets/<svc>/<NAME>
#   status            ready | needs-review (migrate needs --force) | plan-only (refused)
#   compose_dir       relative to REPO_ROOT; env_file relative to compose_dir
#   override          compose override in compose_dir, appended to COMPOSE_FILE in the .env
#   compose_services  services to recreate (and verified in the rendered config)
#   names             keys moved out of the .env into credentials
#   env_vars          container env vars that must be gone after migration (default: names)
#   requires          <svc>/<NAME> credentials that must already exist
#   method            shim | native (*_FILE read by the image itself)
#
# Rollout order: searxng (pilot) -> beszel-agent -> homarr -> mail-rss-service
#   -> telegram-downloader / telegram-browser -> command-center -> hermes.
# Not secrets (stay in .env): TELEGRAM_ALLOWED_USERS, OTP_FORWARD_BOT_ID, OTP_FORWARD_CHAT_ID
#   (numeric ids, also visible to anyone in the chat), BESZEL_KEY (hub PUBLIC key),
#   TELEGRAM_SESSION (a path), IMAP_HOST/IMAP_MAILBOX, URLs.
version: 1
services:
  searxng:
    status: ready
    method: shim
    compose_dir: home-agent
    env_file: .env
    override: compose.secrets.searxng.yaml
    compose_services: [searxng]
    names: [SEARXNG_SECRET]

  beszel-agent:
    status: ready
    method: native
    compose_dir: beszel
    env_file: .env
    override: compose.secrets.yaml
    compose_services: [beszel-agent]
    names: [BESZEL_TOKEN]
    env_vars: [TOKEN]

  homarr:
    status: ready
    method: native
    compose_dir: homarr
    env_file: .env
    override: compose.secrets.yaml
    compose_services: [homarr]
    names: [SECRET_ENCRYPTION_KEY]

  mail-rss-service:
    status: ready
    method: shim
    compose_dir: mail_rss_service
    env_file: .env
    override: compose.secrets.yaml
    compose_services: [mail-rss-service]
    names: [IMAP_USER, IMAP_PASS]

  telegram-downloader:
    status: needs-review
    method: shim
    compose_dir: telegram-downloader
    env_file: .env
    override: compose.secrets.yaml
    compose_services: [telegram-downloader]
    names: [TELEGRAM_API_ID, TELEGRAM_API_HASH, JELLYFIN_API_KEY]

  telegram-browser:
    status: needs-review
    method: shim
    compose_dir: telegram-browser
    env_file: .env
    override: compose.secrets.yaml
    compose_services: [telegram-browser]
    names: [TELEGRAM_API_ID, TELEGRAM_API_HASH]

  command-center:
    status: needs-review
    method: shim
    compose_dir: home-agent
    env_file: .env
    override: compose.secrets.command-center.yaml
    compose_services: [command-center, command-center-mcp]
    names: [COMMAND_CENTER_TOKEN, COMMAND_CENTER_CALLBACK_TOKEN, UPTIME_KUMA_API_KEY, JELLYFIN_API_KEY]

  hermes:
    status: needs-review
    method: shim
    compose_dir: home-agent
    env_file: .env
    override: compose.secrets.hermes.yaml
    compose_services: [hermes]
    names: [OPENAI_API_KEY, TELEGRAM_BOT_TOKEN]
    env_vars: [OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, COMMAND_CENTER_CALLBACK_TOKEN]
    requires: [command-center/COMMAND_CENTER_CALLBACK_TOKEN]

  hermes-internal:
    status: plan-only
    method: shim
    compose_dir: home-agent
    env_file: hermes/.env
    override: compose.secrets.hermes.yaml
    compose_services: [hermes]
    names: [API_SERVER_KEY]
