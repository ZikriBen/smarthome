# smarthome-secrets runtime file owners: <svc|*> <uid>:<gid>
# Installed to /etc/smarthome-secrets/owners.conf (root-owned; the repo copy is a template).
# A file mounted with compose `secrets:` keeps this host owner and mode 0400 inside the
# container, so the owner must be the uid that READS it. All images below read their
# secrets as root (the shim / native *_FILE loader runs before any privilege drop):
#   searxng       entrypoint.sh runs as root (image has no USER)
#   beszel-agent  /agent runs as root (scratch image, no USER)
#   homarr        /app/entrypoint.sh reads *_FILE as root, then su-exec $PUID (default 0)
#   mail-rss / telegram-* / command-center*: our Dockerfiles have no USER -> root
#   hermes        shim runs before hermes-network-guard / s6 (root), drops to HERMES_UID later
*               0:0
