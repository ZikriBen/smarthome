# Hermes overrides. Defaults: /opt/hermes/cli-config.yaml.example inside the image.

model:
  provider: "custom"
  base_url: "https://api.openai.com/v1"
  default: "gpt-5.5"

web:
  search_backend: "searxng"

# Web assistant: public-web search, browsing, and task planning. Chromium is
# prevented from reaching LAN/Tailscale/loopback targets by the container guard.
# No terminal, file or docker access.
platform_toolsets:
  cli: [search, browser, todo]
  telegram: [search, browser, todo, cronjob]
  # Scheduled follow-ups may reason over Command Center results, but receive no
  # terminal, filesystem, browser, or general web capability.
  cron: [todo]

mcp_servers:
  command_center:
    url: http://command-center-mcp:8000/mcp
    # super_hist_login_start may wait ~45s for a relayed SMS code on top of the site's 10s request spacing;
    # a Super-Hist cart tool may include the one automatic login (≤3 min wait) → 270 s.
    timeout: 270
    # This server has no legitimate reason to ask Hermes to invoke a model.
    sampling:
      enabled: false
    # Keep the initial surface deliberately small and stable.
    tools:
      include:
        - system_health
        - docker_containers
        - uptime_kuma_status
        - media_download_status
        - jellyfin_search
        - jellyfin_series_episodes
        - calendar_events
        - google_calendars
        - propose_calendar_event
        - propose_calendar_event_update
        - propose_calendar_event_delete
        - gmail_search
        - gmail_message
        - propose_gmail_send
        - attachment_files
        - workspace_files
        - save_attachment_to_workspace
        - read_workspace_text
        - read_pdf
        - write_workspace_text
        - delete_workspace_file
        - searchgram_search
        - searchgram_next_page
        - searchgram_previous_page
        - queue_searchgram_result
        - searchgram_delivery_status
        - map_search
        - price_watch_status
        - price_quote
        - propose_docker_restart
        - propose_price_watch
        - grocery_add_item
        - grocery_list
        - grocery_remove
        - grocery_clear
        - grocery_learn_preference
        - grocery_preferences
        - grocery_cart
        - grocery_cart_status
        - super_hist_status
        - super_hist_login_start
        - super_hist_login_code
        - super_hist_logout
        - super_hist_cart_view
        - super_hist_search
        - super_hist_cart_add
        - super_hist_cart_set_qty
        - super_hist_cart_remove
        - super_hist_deals
        - super_hist_deals_status

browser:
  # "off" = built-in browser_* tools on local Chromium (default auto-picks the Browser Use CLI,
  # which hides those tools and left the agent with no browser).
  backend: "off"
  inactivity_timeout: 120
  restrict_evaluate: true

# Browser vault: no external password managers. The local vault stays empty unless we add logins.
vault:
  onepassword:
    enabled: false
  bitwarden:
    enabled: false

# Block browser/web access to LAN, Tailscale and loopback addresses (default, pinned explicitly).
security:
  allow_private_urls: false

platforms:
  telegram:
    guest_mode: false

# Hermes latches first-touch hints here; keep the profile-building offer suppressed.
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '<TELEGRAM_HOME_CHANNEL>'
      name: <HOME_CHANNEL_NAME>
      user_id: '<TELEGRAM_HOME_CHANNEL>'
# Local plugins (hermes/plugins/<name>); opt-in list.
plugins:
  enabled:
    - otp-relay
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true

_config_version: 46
approvals:
  destructive_slash_confirm: false
cron:
  wrap_response: false
