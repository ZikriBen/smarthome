# Hermes overrides. Defaults: /opt/hermes/cli-config.yaml.example inside the image.

model:
  provider: "custom"
  base_url: "https://api.openai.com/v1"
  default: "gpt-5.5"

web:
  search_backend: "searxng"

# Web assistant: search and task planning. Browser disabled until egress to LAN is blocked at the network level
# (Hermes allow_private_urls does not stop Chromium navigation).
# No terminal, file or docker access.
platform_toolsets:
  cli: [search, todo]
  telegram: [search, todo]

browser:
  # "off" = built-in browser_* tools on local Chromium (default auto-picks the Browser Use CLI,
  # which hides those tools and left the agent with no browser).
  backend: "off"
  inactivity_timeout: 120
  restrict_evaluate: true

# Browser vault: no external password managers. The local vault stays empty unless we add logins.
vault:
  onepassword:
    enabled: false
  bitwarden:
    enabled: false

# Block browser/web access to LAN, Tailscale and loopback addresses (default, pinned explicitly).
security:
  allow_private_urls: false

platforms:
  telegram:
    guest_mode: false

# Hermes latches first-touch hints here; keep the profile-building offer suppressed.
onboarding:
  seen:
    profile_build_offered: true

_config_version: 46
