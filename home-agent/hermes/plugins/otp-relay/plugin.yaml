name: otp-relay
version: 1.1.0
description: "Consumes one-time SMS codes from Ben's forward bot (#OTP <site> <raw SMS text>) before auth and the agent, and stores only the extracted code in the shared OTP inbox for the Command Center. Everything from the forward bot is dropped from the conversation. Also imported by the Telegram adapter's early intercept (runs before the adapter's auth gate)."
author: "home-agent"
provides_hooks:
  - pre_gateway_dispatch
