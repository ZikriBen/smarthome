# smarthome-secrets override for searxng (PILOT). Activated by smarthome-secrets-migrate
# searxng (appends this file to COMPOSE_FILE in home-agent/.env); inert otherwise.
#
# Image searxng/searxng (pinned digest in compose.yaml): ENTRYPOINT
# /usr/local/searxng/entrypoint.sh, no CMD, no USER (runs as root, busybox sh).
# SearXNG has no native *_FILE support (it reads env SEARXNG_SECRET), so the shim
# exports it from /run/secrets/SEARXNG_SECRET and execs the original entrypoint.
services:
  searxng:
    entrypoint: ["/usr/local/bin/secrets-env-shim", "/usr/local/searxng/entrypoint.sh"]
    environment:
      SEARXNG_SECRET: !reset null
      SEARXNG_SECRET_FILE: /run/secrets/SEARXNG_SECRET
      SECRETS_FROM_FILES: SEARXNG_SECRET
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: searxng_SEARXNG_SECRET
        target: SEARXNG_SECRET

secrets:
  searxng_SEARXNG_SECRET:
    file: /run/smarthome-secrets/searxng/SEARXNG_SECRET
