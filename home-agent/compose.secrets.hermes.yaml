# smarthome-secrets override for hermes (NEEDS-REVIEW, migrate LAST, after command-center).
# Must come after compose.secrets.command-center.yaml in COMPOSE_FILE (migrate appends it).
#
# Image smarthome-hermes-agent (hermes/Dockerfile, base nousresearch/hermes-agent pinned):
# ENTRYPOINT /usr/local/bin/hermes-network-guard (sh, root) -> exec
# /opt/hermes/docker/entrypoint-dispatch.sh, which checks $$ = 1 before s6-overlay /init.
# The shim only exec's, so PID 1 is preserved. s6 snapshots the container env into
# /run/s6/container_environment (container tmpfs) exactly as it does today for env vars.
# hermes/.env (API_SERVER_KEY) is read by Hermes itself from /opt/data -> plan-only.
services:
  hermes:
    entrypoint: ["/usr/local/bin/secrets-env-shim", "/usr/local/bin/hermes-network-guard"]
    environment:
      OPENAI_API_KEY: !reset null
      TELEGRAM_BOT_TOKEN: !reset null
      OPENAI_API_KEY_FILE: /run/secrets/OPENAI_API_KEY
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/TELEGRAM_BOT_TOKEN
      SECRETS_FROM_FILES: OPENAI_API_KEY TELEGRAM_BOT_TOKEN COMMAND_CENTER_CALLBACK_TOKEN
    secrets:
      - source: hermes_OPENAI_API_KEY
        target: OPENAI_API_KEY
      - source: hermes_TELEGRAM_BOT_TOKEN
        target: TELEGRAM_BOT_TOKEN

secrets:
  hermes_OPENAI_API_KEY:
    file: /run/smarthome-secrets/hermes/OPENAI_API_KEY
  hermes_TELEGRAM_BOT_TOKEN:
    file: /run/smarthome-secrets/hermes/TELEGRAM_BOT_TOKEN
