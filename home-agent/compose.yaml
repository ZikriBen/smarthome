services:
  hermes:
    image: nousresearch/hermes-agent:latest@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]

    env_file:
      - .env

    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      SEARXNG_URL: http://searxng:8080

    # Hermes state (sessions, memories, logs). config.yaml and SOUL.md are tracked in git.
    volumes:
      - ./hermes:/opt/data

    # No published ports: Telegram uses outbound long polling.
    # No docker.sock: Docker access will go through the Command Center later.

    depends_on:
      - searxng

    # Chromium needs a larger /dev/shm than Docker's 64MB default.
    shm_size: 1gb

    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  searxng:
    image: searxng/searxng:latest@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409
    container_name: searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

    # Internal only, reachable by hermes on the compose network.
