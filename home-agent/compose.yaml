services:
  hermes:
    # Adds an in-container egress firewall before Hermes starts. This keeps a
    # headless browser useful for public sites while preventing LAN access.
    image: smarthome-hermes-agent:2026-10-07
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      # Deliberately do not use ``env_file`` here: it would expose every
      # Command Center and service credential to the LLM runtime.  Hermes gets
      # only its own provider/Telegram credentials and the narrow callback
      # capability used by a human tapping an approval button.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?set TELEGRAM_ALLOWED_USERS in .env}
      COMMAND_CENTER_CALLBACK_TOKEN: ${COMMAND_CENTER_CALLBACK_TOKEN:?set COMMAND_CENTER_CALLBACK_TOKEN in .env}
      HERMES_UID: 1000
      HERMES_GID: 1000
      SEARXNG_URL: http://searxng:8080
      # otp-relay plugin (hermes/plugins/otp-relay): numeric user id of Ben's SMS forward bot. Empty = inert.
      # All its messages are consumed by the Telegram adapter BEFORE auth/the agent (it is not an allowed user);
      # from its private chat, `#OTP <site> <raw SMS>` with exactly one code -> only the code lands in hermes/otp/.
      OTP_FORWARD_BOT_ID: ${OTP_FORWARD_BOT_ID:-}
      OTP_FORWARD_CHAT_ID: ${OTP_FORWARD_CHAT_ID:-}
      # Optional diagnostics: 1 = log the payload SHAPE only (every digit masked, length, lines, match count).
      OTP_RELAY_DEBUG_SHAPE: ${OTP_RELAY_DEBUG_SHAPE:-}

    # Hermes state (sessions, memories, logs). config.yaml and SOUL.md are tracked in git.
    volumes:
      - ./hermes:/opt/data

    # No published ports: Telegram uses outbound long polling.
    # No docker.sock: Docker access is constrained through the Command Center MCP adapter.

    depends_on:
      - searxng
      - command-center-mcp

    # Chromium needs a larger /dev/shm than Docker's 64MB default.
    shm_size: 1gb

    # Required only to install the OUTPUT-chain guard in this container's own
    # network namespace. Hermes itself has no shell, file, Docker, or command
    # tool exposed to Telegram users.
    cap_add:
      - NET_ADMIN

    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  searxng:
    image: searxng/searxng:latest@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409
    container_name: searxng
    restart: unless-stopped

    environment:
      # Pass-through (no ${...:?}) so smarthome-secrets-migrate can move it out of .env;
      # then compose.secrets.searxng.yaml supplies it from /run/secrets. If it is unset
      # everywhere SearXNG refuses to start (default "ultrasecretkey"): fails closed.
      SEARXNG_SECRET:

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

    # Internal only, reachable by hermes on the compose network.

  command-center:
    build: ./command-center
    container_name: command-center
    restart: unless-stopped
    environment:
      COMMAND_CENTER_TOKEN: ${COMMAND_CENTER_TOKEN:?set COMMAND_CENTER_TOKEN in .env}
      COMMAND_CENTER_CALLBACK_TOKEN: ${COMMAND_CENTER_CALLBACK_TOKEN:?set COMMAND_CENTER_CALLBACK_TOKEN in .env}
      UPTIME_KUMA_URL: http://host.docker.internal:3001
      UPTIME_KUMA_API_KEY: ${UPTIME_KUMA_API_KEY:?set UPTIME_KUMA_API_KEY in .env}
      TELEGRAM_BROWSER_URL: http://host.docker.internal:8788
      TELEGRAM_DOWNLOADER_URL: http://host.docker.internal:8787
      JELLYFIN_URL: http://host.docker.internal:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in .env}
      # Season finder (media_find_season). Optional TMDb credential = the PRIMARY episode-list source; without
      # it Jellyfin metadata + TVmaze (public, no key; egress to api.tvmaze.com) are used. Preferred: a 0600
      # file under ./secrets/tmdb/ (mounted read-only below). Values are never logged.
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_TOKEN_FILE: /run/secrets/tmdb/tmdb_read_token
      TMDB_API_KEY_FILE: /run/secrets/tmdb/tmdb_api_key
      HAPOALIM_SPOOL_DIR: /hapoalim-spool
      HAPOALIM_OUT_DIR: /hapoalim-out
      HAPOALIM_ARCHIVE_DIR: /hapoalim-archive
      HAPOALIM_REPULL_DAYS: ${HAPOALIM_REPULL_DAYS:-3}
      CAL_SPOOL_DIR: /cal-spool
      CAL_ARCHIVE_DIR: /cal-archive
    # Uptime Kuma publishes its read-only metrics endpoint on the host. This
    # hostname is available only to the Command Center, never to Hermes.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # One-time Google OAuth callback. Bound to the server loopback only and
      # reached from the user's browser through an SSH tunnel.
      - "127.0.0.1:8766:8765"
    volumes:
      - ./command-center/data:/data
      - ./google:/google:ro
      # Optional TMDb credential files for the season finder (absent = TMDb not used).
      - ./secrets/tmdb:/run/secrets/tmdb:ro
      # Incoming Telegram documents are an import-only, read-only source.
      - ./hermes/cache/documents:/attachments:ro
      # One-time-code inbox written by Hermes's otp-relay plugin; read + single-use delete here.
      - ./hermes/otp:/otp-inbox
      # Bank Hapoalim (hapoalim-sync/): approved-run spool + the CSV out dir + the monthly archive
      # (both read-only). CC runs as root in its image, so Ben-owned 0700/0600 files are readable;
      # command-center-mcp has NO mounts and reaches them only through this API.
      # Created by hapoalim-sync/host/setup-host.sh; without them the feature stays inert.
      - /var/lib/hapoalim-spool:/hapoalim-spool
      - /home/ben/smarthome/data/hapoalim/out:/hapoalim-out:ro
      - /home/ben/smarthome/data/hapoalim/archive:/hapoalim-archive:ro
      # Cal (visaCal) credit cards (hapoalim-sync/host/setup-cal-host.sh): approved-run spool + the monthly
      # card archive (read-only). Without them the Cal tools stay inert (no_archive / runner never fires).
      - /var/lib/cal-spool:/cal-spool
      - /home/ben/smarthome/data/cal/archive:/cal-archive:ro
      # This is the sole assistant-writable filesystem area. It is disposable
      # and deliberately not mounted into Hermes itself.
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    # Internal only. Its authenticated API is reachable only through the MCP adapter.

  command-center-mcp:
    build: ./command-center
    container_name: command-center-mcp
    restart: unless-stopped
    command: ["python", "/app/mcp-server.py"]
    environment:
      COMMAND_CENTER_TOKEN: ${COMMAND_CENTER_TOKEN:?set COMMAND_CENTER_TOKEN in .env}
    depends_on:
      - command-center
    # Internal-only adapter: it has no Docker socket or host mounts.
