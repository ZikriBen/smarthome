# smarthome-secrets override for command-center + command-center-mcp (NEEDS-REVIEW).
# Before migrating: convert the ${X:?...} lines for these names in compose.yaml to
# pass-through form (see secrets/README.md "home-agent base edits").
#
# Image: built from command-center/Dockerfile (python:3.13-alpine, busybox sh), no
# ENTRYPOINT, CMD ["python", "/app/app.py"], no USER (root). Setting entrypoint drops
# the image CMD, so command is repeated here. command-center-mcp keeps its compose command.
# COMMAND_CENTER_CALLBACK_TOKEN is also consumed by hermes, so hermes gets the shim
# for that one name here (compose.secrets.hermes.yaml later extends the allowlist).
services:
  command-center:
    entrypoint: ["/usr/local/bin/secrets-env-shim"]
    command: ["python", "/app/app.py"]
    environment:
      COMMAND_CENTER_TOKEN: !reset null
      COMMAND_CENTER_CALLBACK_TOKEN: !reset null
      UPTIME_KUMA_API_KEY: !reset null
      JELLYFIN_API_KEY: !reset null
      COMMAND_CENTER_TOKEN_FILE: /run/secrets/COMMAND_CENTER_TOKEN
      COMMAND_CENTER_CALLBACK_TOKEN_FILE: /run/secrets/COMMAND_CENTER_CALLBACK_TOKEN
      UPTIME_KUMA_API_KEY_FILE: /run/secrets/UPTIME_KUMA_API_KEY
      JELLYFIN_API_KEY_FILE: /run/secrets/JELLYFIN_API_KEY
      SECRETS_FROM_FILES: COMMAND_CENTER_TOKEN COMMAND_CENTER_CALLBACK_TOKEN UPTIME_KUMA_API_KEY JELLYFIN_API_KEY
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: cc_COMMAND_CENTER_TOKEN
        target: COMMAND_CENTER_TOKEN
      - source: cc_COMMAND_CENTER_CALLBACK_TOKEN
        target: COMMAND_CENTER_CALLBACK_TOKEN
      - source: cc_UPTIME_KUMA_API_KEY
        target: UPTIME_KUMA_API_KEY
      - source: cc_JELLYFIN_API_KEY
        target: JELLYFIN_API_KEY

  command-center-mcp:
    entrypoint: ["/usr/local/bin/secrets-env-shim"]
    environment:
      COMMAND_CENTER_TOKEN: !reset null
      COMMAND_CENTER_TOKEN_FILE: /run/secrets/COMMAND_CENTER_TOKEN
      SECRETS_FROM_FILES: COMMAND_CENTER_TOKEN
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: cc_COMMAND_CENTER_TOKEN
        target: COMMAND_CENTER_TOKEN

  hermes:
    entrypoint: ["/usr/local/bin/secrets-env-shim", "/usr/local/bin/hermes-network-guard"]
    environment:
      COMMAND_CENTER_CALLBACK_TOKEN: !reset null
      COMMAND_CENTER_CALLBACK_TOKEN_FILE: /run/secrets/COMMAND_CENTER_CALLBACK_TOKEN
      SECRETS_FROM_FILES: COMMAND_CENTER_CALLBACK_TOKEN
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: cc_COMMAND_CENTER_CALLBACK_TOKEN
        target: COMMAND_CENTER_CALLBACK_TOKEN

secrets:
  cc_COMMAND_CENTER_TOKEN:
    file: /run/smarthome-secrets/command-center/COMMAND_CENTER_TOKEN
  cc_COMMAND_CENTER_CALLBACK_TOKEN:
    file: /run/smarthome-secrets/command-center/COMMAND_CENTER_CALLBACK_TOKEN
  cc_UPTIME_KUMA_API_KEY:
    file: /run/smarthome-secrets/command-center/UPTIME_KUMA_API_KEY
  cc_JELLYFIN_API_KEY:
    file: /run/smarthome-secrets/command-center/JELLYFIN_API_KEY
