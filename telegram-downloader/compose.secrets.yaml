# smarthome-secrets override for telegram-downloader (NEEDS-REVIEW: restart interrupts
# running downloads; check the NUC .env has no COMPOSE_FILE / extra -f usage first).
# Image: built from telegram-downloader/Dockerfile (python:3.13-slim, dash), no
# ENTRYPOINT, CMD ["python","-m","app.main"], no USER (root). Telethon session in ./data
# is untouched (plan only, see README).
services:
  telegram-downloader:
    entrypoint: ["/usr/local/bin/secrets-env-shim"]
    command: ["python", "-m", "app.main"]
    environment:
      TELEGRAM_API_ID_FILE: /run/secrets/TELEGRAM_API_ID
      TELEGRAM_API_HASH_FILE: /run/secrets/TELEGRAM_API_HASH
      JELLYFIN_API_KEY_FILE: /run/secrets/JELLYFIN_API_KEY
      SECRETS_FROM_FILES: TELEGRAM_API_ID TELEGRAM_API_HASH JELLYFIN_API_KEY
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: tgdl_TELEGRAM_API_ID
        target: TELEGRAM_API_ID
      - source: tgdl_TELEGRAM_API_HASH
        target: TELEGRAM_API_HASH
      - source: tgdl_JELLYFIN_API_KEY
        target: JELLYFIN_API_KEY

secrets:
  tgdl_TELEGRAM_API_ID:
    file: /run/smarthome-secrets/telegram-downloader/TELEGRAM_API_ID
  tgdl_TELEGRAM_API_HASH:
    file: /run/smarthome-secrets/telegram-downloader/TELEGRAM_API_HASH
  tgdl_JELLYFIN_API_KEY:
    file: /run/smarthome-secrets/telegram-downloader/JELLYFIN_API_KEY
