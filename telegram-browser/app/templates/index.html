<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Media Browser</title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>

<header class="topbar">

    <div>
        <h1>Media Browser</h1>

        <div class="subtitle">
            סרטים מטלגרם
        </div>
    </div>

        <nav class="topbar-actions app-tabs">
        <a
            class="app-tab active"
            href="/"
        >
            ספרייה
        </a>

        <a
            class="app-tab"
            href="/search"
        >
            חיפוש בטלגרם
        </a>

        <a
            class="app-tab"
            href="/downloads"
        >
            הורדות
        </a>
    </nav>

</header>


<section class="controls">

    <input
        id="searchInput"
        type="search"
        placeholder="חיפוש סרט..."
        autocomplete="off"
    >

    <select id="genreFilter">

        <option value="">
            כל הז'אנרים
        </option>

    </select>

    <select id="sortSelect">

        <option value="newest">
            נוספו לאחרונה
        </option>

        <option value="rating_desc">
            דירוג IMDb - גבוה לנמוך
        </option>

        <option value="rating_asc">
            דירוג IMDb - נמוך לגבוה
        </option>

        <option value="year_desc">
            שנה - חדש לישן
        </option>

        <option value="year_asc">
            שנה - ישן לחדש
        </option>

    </select>

    <label class="saved-filter">
        <input
            type="checkbox"
            id="savedFilter"
        >
        שמורים בלבד ⭐
    </label>

</section>


<div
    id="status"
    class="status"
>
    טוען סרטים...
</div>


<main
    id="grid"
    class="grid"
>
</main>


<nav
    id="pagination"
    class="pagination"
>
</nav>


<dialog id="detailsDialog">

    <button
        id="closeDialog"
        class="dialog-close"
    >
        ×
    </button>

    <div id="dialogContent"></div>

</dialog>


<div id="watchOverlay" class="watch-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="watchTitle">
    <div class="watch-box">
        <h2 id="watchTitle" class="watch-title"></h2>
        <ol class="watch-steps">
            <li id="watchStepJf" class="watch-step" data-state="active">
                <span class="watch-step-icon" aria-hidden="true"></span>
                <div class="watch-step-body">
                    <div class="watch-step-label">מכינה את הסרט ב-Jellyfin</div>
                    <div id="watchJfDetail" class="watch-step-detail" aria-live="polite"></div>
                </div>
            </li>
            <li id="watchStepSubs" class="watch-step" data-state="waiting">
                <span class="watch-step-icon" aria-hidden="true"></span>
                <div class="watch-step-body">
                    <div class="watch-step-label">מכינה כתוביות בעברית</div>
                    <div class="watch-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div id="watchSubsBar" class="watch-bar-fill"></div>
                    </div>
                    <div id="watchSubsDetail" class="watch-step-detail" aria-live="polite"></div>
                </div>
            </li>
        </ol>
        <p id="watchHint" class="watch-hint"></p>
        <div class="watch-actions">
            <button id="watchGo" class="watch-action primary" type="button" hidden>לצפות עכשיו</button>
            <button id="watchRetry" class="watch-action primary" type="button" hidden>נסה שוב</button>
            <a id="watchLibrary" class="watch-action" href="#" hidden>פתח את ספריית Telegram Streams</a>
            <button id="watchClose" class="watch-action" type="button">סגור</button>
        </div>
    </div>
</div>

<script>

const PAGE_SIZE = 25;

const ACTIVE_DOWNLOAD_STATES =
    new Set([
        "QUEUED",
        "DOWNLOADING",
        "PROCESSING",
        "RETRY_WAIT",
    ]);

let currentPage = 1;
let currentPagination = null;

let searchTimer = null;
let indexPollTimer = null;
let downloadPollTimer = null;

let visibleMessageIds = [];


function readStateFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const page =
        Number.parseInt(
            params.get("page")
            || "1",
            10
        );

    currentPage =
        Number.isFinite(page)
        && page > 0
            ? page
            : 1;

    const search =
        params.get("search");

    const genre =
        params.get("genre");

    const sort =
        params.get("sort");

    const saved =
        params.get("saved");

    if (search !== null) {
        document.getElementById(
            "searchInput"
        ).value = search;
    }

    if (genre !== null) {
        document.getElementById(
            "genreFilter"
        ).dataset.initialGenre =
            genre;
    }

    if (sort !== null) {
        document.getElementById(
            "sortSelect"
        ).value = sort;
    }

    document.getElementById(
        "savedFilter"
    ).checked =
        saved === "1";
}


function writeStateToUrl(
    {
        replace = false
    } = {}
) {

    const params =
        new URLSearchParams();

    if (currentPage > 1) {
        params.set(
            "page",
            currentPage
        );
    }

    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();

    const genre =
        document.getElementById(
            "genreFilter"
        ).value;

    const sort =
        document.getElementById(
            "sortSelect"
        ).value;

    if (search) {
        params.set(
            "search",
            search
        );
    }

    if (genre) {
        params.set(
            "genre",
            genre
        );
    }

    if (sort !== "newest") {
        params.set(
            "sort",
            sort
        );
    }

    if (
        document.getElementById(
            "savedFilter"
        ).checked
    ) {
        params.set(
            "saved",
            "1"
        );
    }

    const query =
        params.toString();

    const url =
        query
            ? `/?${query}`
            : "/";

    if (replace) {
        history.replaceState(
            null,
            "",
            url
        );

    } else {
        history.pushState(
            null,
            "",
            url
        );
    }
}


function escapeHtml(
    value
) {

    if (
        value === null
        || value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function formatSize(
    bytes
) {

    if (!bytes) {
        return "";
    }

    const gb =
        bytes
        / 1024
        / 1024
        / 1024;

    if (gb >= 1) {
        return (
            `${gb.toFixed(1)} GB`
        );
    }

    const mb =
        bytes
        / 1024
        / 1024;

    return (
        `${mb.toFixed(0)} MB`
    );
}


function qualityRank(
    quality
) {

    const ranks = {
        "2160p": 100,
        "1080p": 90,
        "900p": 80,
        "720p+": 75,
        "720p": 70,
        "576p": 60,
        "570p": 59,
        "540p": 55,
        "480p": 50,
        "430p": 45,
        "360p": 40,
        "HDTV": 30,
        "WEBRip": 25,
        "HDRip": 20,
        "DVDRip": 10,
    };

    return (
        ranks[quality]
        ?? 0
    );
}


function statusText(
    status
) {

    const labels = {
        "QUEUED":
            "בתור",

        "DOWNLOADING":
            "מוריד…",

        "PROCESSING":
            "מעבד…",

        "AVAILABLE":
            "זמין ✓",

        "RETRY_WAIT":
            "ממתין לניסיון נוסף",

        "FAILED":
            "נכשל",
    };

    return (
        labels[status]
        || status
    );
}


function renderSkeletons(
    count = PAGE_SIZE
) {

    const grid =
        document.getElementById(
            "grid"
        );

    grid.innerHTML = "";

    for (
        let index = 0;
        index < count;
        index++
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "movie-card skeleton-card";

        card.innerHTML = `

            <div
                class="poster-wrapper skeleton-block"
            ></div>

            <div class="card-body">

                <div class="title-area">

                    <div
                        class="skeleton-line skeleton-title"
                    ></div>

                    <div
                        class="skeleton-line skeleton-subtitle"
                    ></div>

                </div>

                <div class="metadata">

                    <div
                        class="skeleton-line skeleton-small"
                    ></div>

                    <div
                        class="skeleton-line skeleton-small"
                    ></div>

                </div>

                <div class="card-genres">

                    <div
                        class="skeleton-pill"
                    ></div>

                    <div
                        class="skeleton-pill"
                    ></div>

                </div>

                <div class="variant-buttons">

                    <div
                        class="skeleton-button"
                    ></div>

                    <div
                        class="skeleton-button"
                    ></div>

                </div>

                <div
                    class="skeleton-details"
                ></div>

            </div>
        `;

        grid.appendChild(
            card
        );
    }
}


async function loadGenres() {

    const response =
        await fetch(
            "/api/genres"
        );

    if (!response.ok) {
        return;
    }

    const genres =
        await response.json();

    const select =
        document.getElementById(
            "genreFilter"
        );

    const current =
        select.value
        ||
        select.dataset.initialGenre
        ||
        "";

    select.innerHTML = `
        <option value="">
            כל הז'אנרים
        </option>
    `;

    for (
        const genre
        of genres
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            genre;

        option.textContent =
            genre;

        select.appendChild(
            option
        );
    }

    select.value =
        current;

    delete (
        select.dataset.initialGenre
    );
}


async function loadItems(
    {
        updateUrl = true,
        replaceUrl = false,
        showSkeleton = true,
    } = {}
) {

    stopDownloadPolling();

    const status =
        document.getElementById(
            "status"
        );

    if (showSkeleton) {
        renderSkeletons();
    }

    status.textContent =
        "טוען סרטים...";

    const requestedPage =
        currentPage;

    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();

    const genre =
        document.getElementById(
            "genreFilter"
        ).value;

    const sort =
        document.getElementById(
            "sortSelect"
        ).value;

    const savedOnly =
        document.getElementById(
            "savedFilter"
        ).checked;

    const params =
        new URLSearchParams({
            page:
                requestedPage,

            page_size:
                PAGE_SIZE,

            search:
                search,

            genre:
                genre,

            sort:
                sort,

            saved_only:
                savedOnly,
        });

    const response =
        await fetch(
            `/api/items?${params}`
        );

    if (!response.ok) {
        status.textContent =
            "שגיאה בטעינת הסרטים";

        return;
    }

    const result =
        await response.json();

    currentPagination =
        result.pagination;

    currentPage =
        result.pagination.page;

    renderGrid(
        result.items
    );

    renderPagination();

    updateStatus();

    await refreshDownloadStatuses();

    if (updateUrl) {
        writeStateToUrl({
            replace:
                replaceUrl,
        });
    }

    updateIndexPolling();
}


function updateStatus() {

    const status =
        document.getElementById(
            "status"
        );

    if (!currentPagination) {
        return;
    }

    if (
        currentPagination
        .history_complete
    ) {

        status.textContent =
            `${currentPagination.total} סרטים`;

        return;
    }

    status.textContent =
        `${currentPagination.total} סרטים באינדקס`
        +
        " · הספרייה עדיין מתעדכנת…";
}


function renderGenres(
    genres
) {

    const visible =
        (genres || [])
        .slice(
            0,
            3
        );

    const remaining =
        Math.max(
            0,
            (genres || []).length
            - visible.length
        );

    let html =
        visible
        .map(
            genre => `
                <span>
                    ${escapeHtml(genre)}
                </span>
            `
        )
        .join("");

    if (remaining > 0) {

        html += `
            <span
                class="more-genres"
            >
                +${remaining}
            </span>
        `;
    }

    return html;
}


async function toggleSaved(
    item,
    button
) {

    const newSaved =
        !item.saved;

    button.disabled =
        true;

    try {

        const response =
            await fetch(
                `/api/items/${item.details_message_id}/save`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                    },

                    body:
                        JSON.stringify({
                            saved:
                                newSaved,
                        }),
                }
            );

        if (!response.ok) {
            return;
        }

        item.saved =
            newSaved;

        button.classList.toggle(
            "saved",
            newSaved
        );

        button.textContent =
            newSaved
                ? "★"
                : "☆";

        button.title =
            newSaved
                ? "הסר משמורים"
                : "שמור לצפייה מאוחר יותר";

        if (
            !newSaved
            &&
            document.getElementById(
                "savedFilter"
            ).checked
        ) {
            await loadItems({
                updateUrl:
                    false,
                showSkeleton:
                    false,
            });
        }

    } finally {

        button.disabled =
            false;
    }
}


function renderGrid(
    items
) {

    visibleMessageIds = [];

    const grid =
        document.getElementById(
            "grid"
        );

    grid.innerHTML =
        "";

    if (!items.length) {

        grid.innerHTML = `
            <div class="empty">
                לא נמצאו סרטים
            </div>
        `;

        return;
    }

    for (
        const item
        of items
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "movie-card";

        const poster =
            item.poster_message_id
                ? `/poster/${item.poster_message_id}`
                : "";

        const rating =
            (
                item.imdb_rating
                !== null
                &&
                item.imdb_rating
                !== undefined
            )
                ? `⭐ ${item.imdb_rating}`
                : "";

        const variants =
            [
                ...(
                    item.variants
                    || []
                )
            ]
            .sort(
                (
                    a,
                    b
                ) =>
                    qualityRank(
                        b.quality
                    )
                    -
                    qualityRank(
                        a.quality
                    )
            );

        for (
            const variant
            of variants
        ) {
            visibleMessageIds.push(
                variant.message_id
            );
        }

        const variantButtons =
            variants
            .map(
                variant => {
                    const quality = escapeHtml(variant.quality || "וידאו");
                    const size = escapeHtml(formatSize(variant.size));
                    return `
                    <div class="variant-row">
                        <div class="variant-meta">
                            <span class="variant-quality">${quality}</span>
                            <span class="variant-size">${size}</span>
                        </div>
                        <div class="variant-actions">
                            <button
                                class="variant-action watch-button"
                                type="button"
                                data-watch-id="${variant.message_id}"
                                data-watch-title="${escapeHtml(item.title || item.english_title || "")}"
                                data-watch-quality="${quality}"
                                aria-label="צפייה ישירה ${quality}"
                            >צפייה ישירה</button>
                            <button
                                class="variant-action quality-button"
                                type="button"
                                data-mode="save"
                                data-message-id="${variant.message_id}"
                                data-quality="${quality}"
                                data-size="${size}"
                                aria-label="שמירה ${quality} (${size})"
                            >שמירה</button>
                        </div>
                    </div>
                `;
                }
            )
            .join("");

        card.innerHTML = `

            <div class="poster-wrapper">

                ${
                    poster
                        ? `
                            <img
                                class="poster"
                                src="${poster}"
                                loading="lazy"
                                alt="${escapeHtml(item.title)}"
                            >
                        `
                        : `
                            <div
                                class="poster poster-placeholder"
                            >
                                אין תמונה
                            </div>
                        `
                }

                <button
                    class="save-button${
                        item.saved
                            ? " saved"
                            : ""
                    }"
                    title="${
                        item.saved
                            ? "הסר משמורים"
                            : "שמור לצפייה מאוחר יותר"
                    }"
                >
                    ${
                        item.saved
                            ? "★"
                            : "☆"
                    }
                </button>

            </div>

            <div class="card-body">

                <div class="title-area">

                    <h2>
                        ${escapeHtml(
                            item.title
                        )}
                    </h2>

                    <div class="english-title">

                        ${
                            item.english_title
                                ? escapeHtml(
                                    item.english_title
                                )
                                : "&nbsp;"
                        }

                    </div>

                </div>

                <div class="metadata">

                    <span>
                        ${item.year}
                    </span>

                    ${
                        rating
                            ? `
                                <span>
                                    ${rating}
                                </span>
                            `
                            : `
                                <span>
                                    &nbsp;
                                </span>
                            `
                    }

                </div>

                <div class="genres card-genres">

                    ${renderGenres(
                        item.genres
                    )}

                </div>

                <div class="variant-buttons">

                    ${
                        variantButtons
                        || `
                            <span class="no-variants">
                                אין קבצי וידאו
                            </span>
                        `
                    }

                </div>

                <button
                    class="details-button"
                >
                    פרטים
                </button>

            </div>
        `;

        card.querySelector(
            ".details-button"
        ).addEventListener(
            "click",
            () => {
                showDetails(
                    item
                );
            }
        );

        card.querySelector(
            ".save-button"
        ).addEventListener(
            "click",
            async event => {

                event.stopPropagation();

                await toggleSaved(
                    item,
                    event.currentTarget
                );

            }
        );

        card.querySelectorAll(
            ".quality-button"
        ).forEach(
            button => {

                button.addEventListener(
                    "click",
                    async event => {

                        event.stopPropagation();

                        await selectDownload(
                            Number(
                                button.dataset
                                .messageId
                            ),
                            button
                        );

                    }
                );

            }
        );

        card.querySelectorAll(
            ".watch-button"
        ).forEach(
            button => {
                button.addEventListener(
                    "click",
                    async event => {
                        event.stopPropagation();
                        await watchNow(
                            Number(button.dataset.watchId),
                            button,
                            button.dataset.watchTitle,
                            button.dataset.watchQuality
                        );
                    }
                );
            }
        );

        grid.appendChild(
            card
        );
    }

    visibleMessageIds = [
        ...new Set(
            visibleMessageIds
        )
    ];
}


function resetButtonDisplay(
    button
) {

    button.classList.remove(
        "download-queued",
        "download-active",
        "download-available",
        "download-failed"
    );

    button.disabled =
        false;

    if (button.dataset.mode === "save") {
        // card row: quality + size are shown as text next to the buttons
        button.textContent = "שמירה";
        button.removeAttribute("title");
        return;
    }

    button.innerHTML = `

        <span class="quality-label">
            ${escapeHtml(
                button.dataset.quality
            )}
        </span>

        <small>
            ${escapeHtml(
                button.dataset.size
            )}
        </small>
    `;
}


function applyJobState(
    button,
    job
) {

    resetButtonDisplay(
        button
    );

    if (!job) {
        return;
    }

    const state =
        job.status;

    if (state === "QUEUED") {

        button.classList.add(
            "download-queued"
        );

        button.disabled = true;

    } else if (
        state === "DOWNLOADING"
        ||
        state === "PROCESSING"
        ||
        state === "RETRY_WAIT"
    ) {

        button.classList.add(
            "download-active"
        );

        button.disabled = true;

    } else if (
        state === "AVAILABLE"
    ) {

        button.classList.add(
            "download-available"
        );

        button.disabled = true;

    } else if (
        state === "FAILED"
    ) {

        button.classList.add(
            "download-failed"
        );

        button.disabled = true;

        button.title =
            job.last_error
            || "Download failed";
    }

    if (button.dataset.mode === "save") {
        button.textContent = statusText(state);
        return;
    }

    button.innerHTML = `

        <span>
            ${escapeHtml(
                statusText(state)
            )}
        </span>

        <small>
            ${escapeHtml(
                button.dataset.quality
            )}
        </small>
    `;
}


async function refreshDownloadStatuses() {

    if (!visibleMessageIds.length) {
        stopDownloadPolling();

        return;
    }

    try {

        const response =
            await fetch(
                "/api/download-status",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                    },

                    body:
                        JSON.stringify({
                            message_ids:
                                visibleMessageIds,
                        }),
                }
            );

        if (!response.ok) {
            return;
        }

        const result =
            await response.json();

        const jobs =
            result.jobs
            || {};

        let hasActive =
            false;

        document.querySelectorAll(
            ".quality-button"
        ).forEach(
            button => {

                const messageId =
                    button.dataset
                    .messageId;

                const job =
                    jobs[
                        messageId
                    ]
                    || null;

                applyJobState(
                    button,
                    job
                );

                if (
                    job
                    &&
                    ACTIVE_DOWNLOAD_STATES
                    .has(
                        job.status
                    )
                ) {
                    hasActive =
                        true;
                }
            }
        );

        if (hasActive) {
            startDownloadPolling();

        } else {
            stopDownloadPolling();
        }

    } catch (
        error
    ) {

        console.error(
            "Download status check failed:",
            error
        );
    }
}


function startDownloadPolling() {

    if (downloadPollTimer) {
        return;

    downloadPollTimer =

function stopDownloadPolling() {

// ---------------------------------------------------------------- Watch now
// No about:blank tab: an in-page popup with two live steps, both driven by
// GET /api/watch/{id}: (1) the Jellyfin item, (2) the Hebrew subtitle sidecar
// (% of the planned bytes + ETA). When both are done THIS tab navigates to
// Jellyfin (same-tab navigation is never a popup, so no blocker can stop it;
// Back returns here). "לצפות עכשיו" is offered as soon as step 1 is done.
const WATCH_PHASES = {
    queued: "מתחילה…",
    writing: "כותבת את הקבצים…",
    subs_header: "בודקת אילו כתוביות יש בקובץ…",
    media_updated: "מודיעה ל-Jellyfin על הסרט…",
    polling: "מחכה ש-Jellyfin יוסיף את הסרט לספרייה…",
    library_refresh: "מרעננת את ספריית Telegram Streams…",
    full_refresh: "סורקת את הספריות (בפעם הראשונה זה לוקח יותר זמן)…",
};
const WATCH_ERRORS = {
    pending: "Jellyfin עדיין לא סרק את הסרט. בדרך כלל זה מסתדר תוך דקה.",
    refresh_skipped: "הקבצים נוצרו, אבל אין מפתח API של Jellyfin ולכן לא ביקשתי ממנו לסרוק.",
    refresh_failed: "Jellyfin לא זמין כרגע. הסרט יופיע בסריקה הבאה שלו.",
    auth_failed: "Jellyfin דחה את מפתח ה-API.",
    error: "משהו השתבש בהכנת הצפייה.",
    network: "אין חיבור לשרת הקטלוג.",
};
const WATCH_POLL_MS = 1500;
const WATCH_EXTRA_WAIT_MS = 30000;  // keep checking after the server's own budget
const watchBusy = new Set();
let watchSession = 0;

function fmtDuration(s) {
    if (s == null || !isFinite(s)) { return ""; }
    if (s < 60) { return `${Math.max(1, Math.round(s))} שנ׳`; }
    const m = Math.floor(s / 60), r = Math.round(s % 60);
    return r ? `${m} דק׳ ${r} שנ׳` : `${m} דק׳`;
}

function subsView(subs) {
    // -> {state: waiting|active|done|none|failed, pct, text}
    if (!subs) { return { state: "waiting", pct: 0, text: "" }; }
    const st = subs.state || subs.status;
    if (st === "done") { return { state: "done", pct: 100, text: "הכתוביות מוכנות" }; }
    if (st === "none" || subs.hebrew === false) {
        return { state: "none", pct: 0, text: "אין כתוביות בעברית בקובץ הזה" };
    }
    if (st === "failed") {
        return { state: "failed", pct: 0, text: "לא הצלחתי להכין כתוביות. אפשר לבחור את הכתוביות המובנות בנגן." };
    }
    const pct = Math.round(100 * (subs.progress || 0));
    if (st === "queued" || subs.hebrew == null) {
        return { state: "active", pct: 0, text: st === "queued" ? "ממתינה בתור…" : "בודקת את הקובץ…" };
    }
    const eta = subs.eta_s != null ? ` · עוד בערך ${fmtDuration(subs.eta_s)}` : "";
    return { state: "active", pct, text: `${pct}%${eta}` };
}

function renderWatch(v) {
    const overlay = document.getElementById("watchOverlay");
    overlay.hidden = false;
    overlay.dataset.state = v.overall;  // loading | ready | error
    document.getElementById("watchTitle").textContent = v.title;
    const jf = document.getElementById("watchStepJf");
    jf.dataset.state = v.jfState;
    document.getElementById("watchJfDetail").textContent = v.jfText || "";
    const sub = document.getElementById("watchStepSubs");
    sub.dataset.state = v.subs.state;
    const bar = document.getElementById("watchSubsBar");
    bar.style.width = `${v.subs.pct}%`;
    bar.parentElement.setAttribute("aria-valuenow", String(v.subs.pct));
    bar.parentElement.hidden = v.subs.state !== "active" && v.subs.state !== "done";
    document.getElementById("watchSubsDetail").textContent = v.subs.text;
    document.getElementById("watchHint").textContent = v.hint || "";
    document.getElementById("watchGo").hidden = !v.goUrl;
    document.getElementById("watchRetry").hidden = v.overall !== "error";
    const lib = document.getElementById("watchLibrary");
    if (v.libraryUrl) { lib.href = v.libraryUrl; }
    lib.hidden = v.overall !== "error" || !v.libraryUrl;
}

function closeWatchOverlay() {
    watchSession++;  // stops polling; the server-side job still finishes
    document.getElementById("watchOverlay").hidden = true;
}

async function getWatchStatus(variantId) {
    const r = await fetch(`/api/watch/${variantId}`, { cache: "no-store" });
    if (!r.ok) {
        throw new Error(`status ${r.status}`);
    }
    return r.json();
}

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

async function watchNow(variantId, button, title, quality) {
    if (watchBusy.has(variantId)) {
        return;  // double tap: the first one is still running (the server joins it too)
    }
    watchBusy.add(variantId);
    const session = ++watchSession;
    const live = () => session === watchSession;
    const buttons = document.querySelectorAll(`.watch-button[data-watch-id="${variantId}"]`);
    buttons.forEach(b => { b.disabled = true; b.textContent = "מכינה…"; });
    const heading = [title, quality].filter(Boolean).join(" · ") || "צפייה ישירה";
    const started = Date.now();
    let libraryUrl = null, readyUrl = null, subs = null, phase = "queued", postDone = null;
    const view = () => {
        const sv = subsView(subs);
        const secs = Math.round((Date.now() - started) / 1000);
        let hint = "";
        if (readyUrl && sv.state === "active") {
            hint = "אפשר כבר לצפות; הכתוביות ימשיכו להיטען ברקע. אם נכנסת לפני שסיימו, בחר/י שוב \"עברית\" בתפריט הכתוביות בעוד כמה דקות.";
        } else if (!readyUrl && secs >= 3) {
            hint = `${secs} שניות · אפשר לחכות כאן, זה נפתח לבד`;
        }
        renderWatch({
            overall: "loading", title: heading,
            jfState: readyUrl ? "done" : "active",
            jfText: readyUrl ? "מוכן" : (WATCH_PHASES[phase] || WATCH_PHASES.polling),
            subs: sv, hint, goUrl: readyUrl, libraryUrl,
        });
        return sv;
    };
    const go = url => {
        if (!live()) { return; }
        renderWatch({ overall: "ready", title: heading, jfState: "done", jfText: "פותחת את Jellyfin…",
                      subs: subsView(subs), goUrl: null });
        window.location.assign(url);
    };
    const fail = (kind, detail) => {
        if (!live()) { return; }
        renderWatch({
            overall: "error", title: heading, jfState: "failed",
            jfText: WATCH_ERRORS[kind] || detail || WATCH_ERRORS.error,
            subs: subsView(subs),
            hint: "אפשר לנסות שוב, או לפתוח את הספרייה ב-Jellyfin ולחפש את הסרט שם.",
            libraryUrl,
        });
        document.getElementById("watchRetry").onclick = () => watchNow(variantId, button, title, quality);
    };
    document.getElementById("watchGo").onclick = () => { if (readyUrl) { go(readyUrl); } };
    const absorb = st => {
        if (!st) { return; }
        libraryUrl = st.library_url || libraryUrl;
        if (st.subtitles !== undefined) { subs = st.subtitles; }
        if (st.phase) { phase = st.phase; }
        if (st.status === "ready" && st.url) { readyUrl = st.url; }
    };
    const terminal = sv => sv.state === "done" || sv.state === "none" || sv.state === "failed" || !subs;
    try {
        view();
        const post = fetch(`/api/watch/${variantId}`, { method: "POST" })
            .then(async r => {
                const data = await r.json().catch(() => ({}));
                postDone = r.ok ? data : { status: "error", message: data.detail };
            })
            .catch(() => { postDone = { status: "network" }; });
        let extraUntil = null;
        while (live()) {
            await sleep(WATCH_POLL_MS);
            if (!live()) { return; }
            if (postDone) { absorb(postDone); }
            try { absorb(await getWatchStatus(variantId)); } catch (e) { /* transient */ }
            const sv = view();
            if (readyUrl && terminal(sv)) { return go(readyUrl); }  // both steps done (or no Hebrew)
            if (postDone && !readyUrl) {
                if (postDone.status === "pending") {
                    extraUntil = extraUntil || Date.now() + WATCH_EXTRA_WAIT_MS;
                    if (Date.now() < extraUntil) { continue; }
                }
                await post;
                return fail(postDone.status, postDone.message);
            }
        }
    } catch (error) {
        console.error(error);
        fail("error");
    } finally {
        watchBusy.delete(variantId);
        buttons.forEach(b => { b.disabled = false; b.textContent = "צפייה ישירה"; });
    }
}

function pageNumbers(
    current,
    total
) {

    if (total <= 9) {

        return Array.from(
            {
                length:
                    total
            },
            (
                _,
                index
            ) =>
                index + 1
        );
    }

    const result = [
        1
    ];

    const start =
        Math.max(
            2,
            current - 3
        );

    const end =
        Math.min(
            total - 1,
            current + 3
        );

    if (start > 2) {
        result.push(
            "..."
        );
    }

    for (
        let page = start;
        page <= end;
        page++
    ) {
        result.push(
            page
        );
    }

    if (
        end
        < total - 1
    ) {
        result.push(
            "..."
        );
    }

    result.push(
        total
    );

    return result;
}


function renderPagination() {

    const pagination =
        document.getElementById(
            "pagination"
        );

    pagination.innerHTML =
        "";

    if (!currentPagination) {
        return;
    }

    const knownPages =
        currentPagination
        .total_pages;

    if (currentPage > 1) {

        pagination.appendChild(
            makePaginationButton(
                "« הקודם",
                currentPage - 1
            )
        );
    }

    const pages =
        pageNumbers(
            currentPage,
            knownPages
        );

    for (
        const page
        of pages
    ) {

        if (
            page
            === "..."
        ) {

            const dots =
                document.createElement(
                    "span"
                );

            dots.className =
                "pagination-dots";

            dots.textContent =
                "...";

            pagination.appendChild(
                dots
            );

            continue;
        }

        const button =
            makePaginationButton(
                String(page),
                page
            );

        if (
            page
            === currentPage
        ) {

            button.classList.add(
                "active"
            );

            button.disabled =
                true;
        }

        pagination.appendChild(
            button
        );
    }

    if (
        currentPage
        < knownPages
    ) {

        pagination.appendChild(
            makePaginationButton(
                "הבא »",
                currentPage + 1
            )
        );
    }

    const pageStatus =
        document.createElement(
            "div"
        );

    pageStatus.className =
        "page-status";

    pageStatus.textContent =
        `עמוד ${currentPage} מתוך ${knownPages}`;

    pagination.appendChild(
        pageStatus
    );
}

async function pollIndexStatus() {

    if (
        !currentPagination
        ||
        currentPagination
        .history_complete
    ) {

        stopIndexPolling();

        return;
    }

    try {

        const response =
            await fetch(
                "/api/index-status"
            );

        if (!response.ok) {
            return;
        }

        const result =
            await response.json();

        if (
            result.history_complete
        ) {

            stopIndexPolling();

            await loadGenres();

            await loadItems({
                updateUrl:
                    false,

                showSkeleton:
                    false,
            });

            return;
        }

        const status =
            document.getElementById(
                "status"
            );

        status.textContent =
            `${result.movies} סרטים באינדקס`
            +
            " · הספרייה עדיין מתעדכנת…";

    } catch (
        error
    ) {

        console.error(
            "Index polling failed:",
            error
        );
    }
}


function startIndexPolling() {

    if (indexPollTimer) {
        return;
    }

    indexPollTimer =
        setInterval(
            pollIndexStatus,
            4000
        );
}


function stopIndexPolling() {

    if (!indexPollTimer) {
        return;
    }

    clearInterval(
        indexPollTimer
    );

    indexPollTimer =
        null;
}


function updateIndexPolling() {

    if (
        currentPagination
        &&
        !currentPagination
        .history_complete
    ) {

        startIndexPolling();

    } else {

        stopIndexPolling();
    }
}

<script>
/* MEDIA_DETAILS_DIALOG_UX */

(() => {
    const dialog =
        document.getElementById("detailsDialog");

    if (!dialog) {
        return;
    }

    /*
     * Native <dialog> covers the viewport, so a normal
     * click listener fires even when clicking its backdrop.
     *
     * Close only when the click coordinates are outside
     * the actual dialog box.
     */
    dialog.addEventListener(
        "click",
        event => {
            const rect =
                dialog.getBoundingClientRect();

            const inside =
                event.clientX >= rect.left
                && event.clientX <= rect.right
                && event.clientY >= rect.top
                && event.clientY <= rect.bottom;

            if (!inside) {
                dialog.close();
            }
        }
    );

    /*
     * Escape already works natively for <dialog>,
     * but keeping this explicit makes the behavior clear.
     */
    dialog.addEventListener(
        "cancel",
        event => {
            event.preventDefault();
            dialog.close();
        }
    );
})();
</script>
