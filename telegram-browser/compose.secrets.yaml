# smarthome-secrets override for telegram-browser (NEEDS-REVIEW).
# Image: built from telegram-browser/Dockerfile (python:3.13-slim, dash), no ENTRYPOINT,
# CMD ["uvicorn","app.web:app","--host","0.0.0.0","--port","8788"], no USER (root).
# Review first: the tg-stream scripts (02-secrets-and-dirs.sh / 07-rebuild-browser.sh) and
# an untracked compose.jellyfin-key.yaml may run compose with explicit -f files, which
# would bypass COMPOSE_FILE and start the browser WITHOUT the Telegram API creds.
# JELLYFIN_API_KEY already comes from a file (JELLYFIN_API_KEY_FILE, tg-stream) and is
# left alone; TELEGRAM_SESSION is a path, not a secret. Telethon .session: plan only.
# Note: SECRETS_FROM_FILES does NOT list JELLYFIN_API_KEY / TG_STREAM_HMAC_KEY, so their
# legitimate *_FILE vars pass through the shim untouched.
services:
  telegram-browser:
    entrypoint: ["/usr/local/bin/secrets-env-shim"]
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8788"]
    environment:
      TELEGRAM_API_ID_FILE: /run/secrets/TELEGRAM_API_ID
      TELEGRAM_API_HASH_FILE: /run/secrets/TELEGRAM_API_HASH
      SECRETS_FROM_FILES: TELEGRAM_API_ID TELEGRAM_API_HASH
    volumes:
      - /usr/local/lib/smarthome-secrets/secrets-env-shim:/usr/local/bin/secrets-env-shim:ro
    secrets:
      - source: tgb_TELEGRAM_API_ID
        target: TELEGRAM_API_ID
      - source: tgb_TELEGRAM_API_HASH
        target: TELEGRAM_API_HASH

secrets:
  tgb_TELEGRAM_API_ID:
    file: /run/smarthome-secrets/telegram-browser/TELEGRAM_API_ID
  tgb_TELEGRAM_API_HASH:
    file: /run/smarthome-secrets/telegram-browser/TELEGRAM_API_HASH
